name: etf daily

# decide  22:30 UTC Mon-Fri -- after the US close (20:00 UTC in summer, 21:00 in winter)
# execute 14:45 UTC Mon-Fri -- after the US open (13:30 UTC in summer, 14:30 in winter)
# decide commits web/data (the append-only decision log and the site data); the
# commit itself triggers the website rebuild. No database.
on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "45 14 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [decide, execute]
        default: decide
      dry_run:
        description: "Compute but write nothing and send nothing"
        type: boolean
        default: false

concurrency:
  # Two overlapping runs could both append the same day or both send orders.
  group: etf-daily
  cancel-in-progress: false

permissions:
  contents: write       # commit the day's decision and site data
  actions: write        # stop GitHub disabling this schedule after 60 quiet days

jobs:
  run:
    # The old US-ETF daily job runs only in its own repository (btc-paper-trader); copies of this file elsewhere skip it.
    if: github.repository == 'fbivinay/btc-paper-trader'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run
        working-directory: ml
        env:
          # Phone alerts for hand-traders: subscribe to this ntfy.sh topic in the ntfy app.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Broker: absent keys mean paper record only. Orders need SEND_ORDERS=on
          # (repository variable = the kill switch); real money also needs ALPACA_LIVE=yes.
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_LIVE: ${{ vars.ALPACA_LIVE }}
          SEND_ORDERS: ${{ vars.SEND_ORDERS }}
          MAX_ORDER_USD: ${{ vars.MAX_ORDER_USD }}
          JOB: ${{ inputs.job || (github.event.schedule == '45 14 * * 1-5' && 'execute' || 'decide') }}
        run: python etf_daily.py "$JOB" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit the decision
        if: ${{ !inputs.dry_run && (inputs.job == 'decide' || github.event.schedule == '30 22 * * 1-5') }}
        run: |
          git config user.name "etf-model-bot"
          git config user.email "etf-model-bot@users.noreply.github.com"
          git add web/data models
          git diff --cached --quiet || git commit -m "Decision for $(date -u +%F)"
          git push

      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/etf-daily.yml/enable"
