# Rebate for resident individuals (section 87A; section 156 of the Income-tax Act 2025 from 2026-04-01), by regime and FINANCIAL YEAR.
# The rebate is the tax or max_rebate, whichever is less, if total income is at most income_limit. marginal_relief = true: just above
# the limit the rebate is what keeps tax from exceeding the income above the limit. applies_to_special = true: the tax on gains taxed
# at special rates is part of the tax the rebate is taken from, except gains whose section is in excluded_sections (section 112A,
# and section 198 of the 2025 Act, are outside the rebate). A row with income_limit 0 means no rebate existed.
[meta]
keys = ["regime"]
coverage_from = 2010-04-01
granularity = "financial_year"
late_keys = [{ regime = "new", from = 2020-04-01 }]

