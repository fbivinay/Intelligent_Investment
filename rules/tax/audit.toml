# Tax audit (section 44AB) for a person trading index futures, whose profit or loss is ordinary business income (S75 section 43(5)).
# turnover_limit: audit turnover above this in the financial year needs a tax audit. The turnover of futures is the sum of the absolute
# profit or loss of each closed trade (S77); engine/business.py works it out. fee: what the audit costs, rupees, assumed.
# From FY2019-20 the higher limit (Rs 5 crore, then Rs 10 crore) needs cash receipts and cash payments each to be at most 5% of the
# total. Money that moves between a bank account and a broker account meets that, so the higher limit is used here. If it were not
# met, the limit would stay Rs 1 crore.
[meta]
keys = []
coverage_from = 2010-04-01

[[row]]
from = 2010-04-01
to = 2012-03-31
turnover_limit = "6000000"
fee = "25000"
source = "S71 Finance Bill 2010 memorandum: the limit for business goes from forty lakh to sixty lakh rupees, effective assessment year 2011-12, i.e. financial year 2010-11; fee S78"
verified_on = 2026-09-30
confidence = "assumed"
note = "turnover_limit is from the source (primary). fee is assumed: no law or ICAI scale fixes it. F&O specialist firms quote Rs 14,000 for audit, accounts and return together, and a general fee guide puts audits of Rs 1 crore to 5 crore of turnover at Rs 25,000 to 60,000 and below Rs 1 crore at Rs 10,000 to 25,000 (S78); Rs 25,000 is where those ranges meet. One nominal figure is used for every year, taken as all-in (GST included) and deducted as a business cost. Asking prices of 2026, not the fees of the year."

