regime = "old"
tiers = []
from = 2010-04-01
to = 2013-03-31
source = "S56, S57 and S40 memoranda: No surcharge shall be levied in the cases of persons covered under paragraph A (individuals)"
verified_on = 2026-09-30
confidence = "primary"
note = "Financial years 2010-11 to 2012-13."

