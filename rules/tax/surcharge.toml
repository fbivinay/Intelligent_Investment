# Surcharge on income-tax for a resident individual, by regime and FINANCIAL YEAR. tiers are ascending: the highest tier whose `above`
# (total income in rupees) is crossed gives the rate; no tier crossed means no surcharge. A tier with test_excludes is tested on total
# income less the incomes it names (the 25% and 37% tiers); the names are gain sections as labelled in tax.capital_gains, or `dividend`
# for dividends taxed at slab rates. cap_special: the surcharge on the tax on the incomes named in cap_sections (same names) cannot
# exceed this rate. The years differ in what they name (S45 and S62 for 2019-20 to 2021-22, S63 and S64 from 2022-23):
#   2019-20:          test excludes and cap covers 111A and 112A gains
#   2020-21, 2021-22: dividends join them; section 112 gains are in the test and not capped
#   2022-23 onward:   section 112 joins too (from 2026-27 the sections are 196, 197 and 198 of the Income-tax Act 2025)
# Marginal relief applies at every tier; the health and education cess is in tax.cess.
[meta]
keys = ["regime"]
coverage_from = 2010-04-01
granularity = "financial_year"
late_keys = [{ regime = "new", from = 2020-04-01 }]

