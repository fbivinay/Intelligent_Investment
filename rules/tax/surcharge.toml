# Surcharge on income-tax for a resident individual, by regime and FINANCIAL YEAR. tiers are ascending: the highest tier whose `above`
# (total income in rupees) is crossed gives the rate; no tier crossed means no surcharge. basis = excluding_special: the tier is tested
# on income excluding dividends and gains taxed at special rates (the 25% and 37% tiers); otherwise on total income. cap_special: the
# surcharge on tax on gains at special rates cannot exceed this rate; cap_sections lists the gains it covers (absent: all special-rate
# gains). Marginal relief applies at every tier; the health and education cess is in tax.cess.
[meta]
keys = ["regime"]
coverage_from = 2010-04-01
granularity = "financial_year"
late_keys = [{ regime = "new", from = 2020-04-01 }]

