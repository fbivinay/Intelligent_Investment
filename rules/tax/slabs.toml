# Income-tax slabs for a resident individual under 60, by regime and FINANCIAL YEAR (rows run 1 April to 31 March).
# brackets are in order; upto is the top of the bracket in rupees (cumulative), the last one is empty (no top). The first bracket is
# the nil-rate band: its upto is the basic exemption. regime old = the ordinary slabs; regime new = the section 115BAC regime
# (optional from 2020-21, the default from 2023-24), which exists only from 2020-04-01.
# Not modelled: the slabs of senior citizens (60 to 79) and very senior citizens (80 and over), and the higher basic exemption that
# women had in 2010-11 (Rs 1.9 lakh against Rs 1.6 lakh). Every profile here is the general resident individual, so tax is never
# understated for someone who was in one of those groups.
[meta]
keys = ["regime"]
coverage_from = 2010-04-01
granularity = "financial_year"
late_keys = [{ regime = "new", from = 2020-04-01 }]

[[row]]
regime = "old"
brackets = [{ upto = "160000", rate = "0" }, { upto = "500000", rate = "0.10" }, { upto = "800000", rate = "0.20" }, { upto = "", rate = "0.30" }]
from = 2010-04-01
to = 2011-03-31
source = "S56 Finance Bill 2010 memorandum: Upto Rs. 1,60,000 Nil; to Rs. 5,00,000 10 per cent; to Rs. 8,00,000 20 per cent; above 30 per cent"
verified_on = 2026-09-30
