# Conventions the tax calculation follows where the law leaves room. name: tax_round_step, setoff_order, shortfall_order, business_loss_setoff.
# setoff_order, shortfall_order and business_loss_setoff describe what engine/tax.py does; they are assumptions (value says so, note says how).
[meta]
keys = ["name"]
coverage_from = 2010-04-01
granularity = "financial_year"

[[row]]
name = "tax_round_step"
value = "10"
from = 2010-04-01
source = "S67 section 288B: tax payable is rounded to the nearest multiple of ten rupees, paise ignored, five or more rounds up"
verified_on = 2026-09-30
confidence = "primary"
note = "Total income is also rounded to the nearest Rs 10 (section 288A); that is not modelled (it moves tax by at most Rs 1.5)."

[[row]]
name = "setoff_order"
value = "as coded in engine/tax.py"
from = 2010-04-01
source = "S0 the law fixes only that a short-term loss may be set off against any capital gain and a long-term loss against long-term gains only (S54); S69 says brought-forward losses are set off before the section 112A exemption"
verified_on = 2026-09-30
confidence = "assumed"
note = "As coded: this year's short-term loss on short-term gains, long-term loss on long-term gains, leftover short-term loss on long-term gains, then losses brought forward (long-term first, oldest first), highest special rate first, then slab-taxed gains; then the yearly exemption."

[[row]]
name = "shortfall_order"
value = "as coded in engine/tax.py"
from = 2010-04-01
source = "S0 the law says only that gains shrink by the unused basic exemption of a resident individual (S55 sections 196(2) and 198(3) of the Income-tax Act 2025, the same as the 1961 Act provisos); S69 says the highest-rate gain is usually taken first"
verified_on = 2026-09-30
confidence = "assumed"
note = "As coded: a resident individual's unused basic exemption is applied to gains taxed at special rates, highest rate first, after the yearly section 112A exemption. S69 reports that the Income Tax portal calculator (June 2025) applied it to equity gains before the section 112A exemption when equity and other long-term gains are both taxed at 12.5%; this model takes the exemption first, which gives the lower tax."

[[row]]
name = "business_loss_setoff"
value = "interest and slab-taxed income only, not the other income given, as coded in engine/tax.py"
from = 2010-04-01
source = "S0 assumption: the law lets a loss under the head business be set off against income under any head except salary, capital gains included (S75 section 71(1), (2) and (2A)); this engine sets it off against interest and income taxed at slab rates only"
verified_on = 2026-09-30
confidence = "assumed"
note = "Conservative. Section 71(2A) bars setting a business loss off against salary, and the other taxable income a user gives may be salary, so it is never touched. A futures loss lowers interest, dividends at slab rates and gains at slab rates, and is never set off against gains taxed at special rates (the law would allow that). What is left over is carried forward for business income only (S75 section 72, S76 section 112). Cost if wrong: a user whose other income is not salary (rent, another business) gets the set-off a year later instead of at once; a user with special-rate gains in a loss year pays more tax that year than the law asks."

[[row]]
name = "marginal_relief_order"
value = "the income above a surcharge threshold is taken from slab income first, then from gains at special rates, lowest rate first, as coded in engine/tax.py"
from = 2010-04-01
source = "S0 assumption: the provisos on surcharge (see rules/tax/surcharge.toml, S61 and S62) limit tax and surcharge to the tax on the threshold income plus the income above it, without saying which income counts as the income above it"
verified_on = 2026-09-30
confidence = "assumed"
note = "Conservative. Taking the excess from slab income first and then from the lowest-rate gains leaves the highest-rate income in the threshold amount, which gives the least relief. It matters only when the income above a threshold is mostly gains taxed at special rates (a large sale in a year with little pay). The part of a gain that the yearly section 112A exemption leaves untaxed stays in the threshold amount. Cost if wrong: the relief is off by up to the difference of two rates on the excess, in a band of a few lakh above a threshold."
