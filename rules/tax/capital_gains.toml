# Capital-gains treatment by BUCKET (tax.buckets) and SALE date.
# lt_months: long-term when held for MORE than this many months. always_short = true: the gain is deemed short-term whatever the
#   holding period (section 50AA), so lt_months and the lt_* fields are absent and not used.
# st_treatment and lt_treatment: special = taxed on its own at st_rate or lt_rate; slab = added to income and taxed at slab rates;
#   exempt = not taxed, and a loss on it cannot be set off or carried forward.
# indexation = true: cost is multiplied by CII of the sale year over CII of the purchase year (tax.cii) before the gain is computed.
# lt_alt_rate, lt_alt_indexation, lt_alt_section: an option the taxpayer has instead (section 112 proviso, units sold up to
#   2014-07-10): tax at lt_alt_rate on the gain worked out with lt_alt_indexation. The lower tax is used.
# lt_exemption_group: the yearly exemption pool in tax.lt_exemption. grandfather_acq_upto: for holdings bought on or before this
#   date the cost is the higher of the actual cost and the lower of the 31 Jan 2018 value and the sale value.
# st_section and lt_section are labels shown in the calculation. The Income-tax Act 2025 applies to sales from 2026-04-01.
[meta]
keys = ["bucket"]
coverage_from = 2010-04-01
late_keys = [{ bucket = "gold_post_apr2023", from = 2023-04-01 }, { bucket = "debt_post_apr2023", from = 2023-04-01 }]

