from = 2010-04-01
to = 2018-03-31
source = "S40 section 111A tax on short-term gains is 15%; S43 long-term gains on STT-paid equity and equity oriented fund units are exempt under section 10(38) until withdrawn from 2018-04-01; S41 same benefits: long-term exempt, short-term 15%"
